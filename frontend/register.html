<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GeoQR Portal - Create New Account">
    <title>GeoQR Portal - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            var theme = localStorage.getItem('geoqr-theme');
            if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'soft-light-pro' : 'dark-pro';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="url(#gradient1)" stroke-width="3" />
                        <circle cx="20" cy="20" r="8" fill="url(#gradient1)" />
                        <circle cx="20" cy="8" r="3" fill="#818cf8" />
                        <defs>
                            <linearGradient id="gradient1" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>GeoQR</h1>
                    <span class="logo-badge">Attendance Portal</span>
                </div>
            </a>
        </header>

        <!-- Register Card -->
        <main class="login-card glass-card">
            <div class="card-header">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="8.5" cy="7" r="4" />
                        <line x1="20" y1="8" x2="20" y2="14" />
                        <line x1="23" y1="11" x2="17" y2="11" />
                    </svg>
                </div>
                <h2>Create Account</h2>
                <p class="card-description">Register to access the attendance system</p>
            </div>

            <form id="registerForm" class="login-form">
                <!-- Role Selection -->
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        Select Role
                    </label>
                    <div class="role-selector">
                        <input type="radio" id="roleStudent" name="role" value="student" checked>
                        <label for="roleStudent" class="role-option">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c3 3 9 3 12 0v-5" />
                            </svg>
                            <span>Student</span>
                        </label>

                        <input type="radio" id="roleFaculty" name="role" value="faculty">
                        <label for="roleFaculty" class="role-option">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <span>Faculty</span>
                        </label>
                    </div>
                </div>

                <!-- Name (for Student/Admin) -->
                <div class="form-group" id="nameGroup">
                    <label for="name">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        Full Name
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        <span class="input-focus"></span>
                    </div>
                </div>


                <!-- Email (for Student/Admin) -->
                <div class="form-group" id="emailGroup">
                    <label for="email">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        Email
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                        <span class="input-focus"></span>
                    </div>
                </div>


                <!-- Student ID (shown only for students) -->
                <div class="form-group" id="studentIdGroup">
                    <label for="studentId">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                            <line x1="7" y1="8" x2="17" y2="8" />
                            <line x1="7" y1="12" x2="12" y2="12" />
                        </svg>
                        Student ID
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="studentId" name="studentId" placeholder="e.g., STU001">
                        <span class="input-focus"></span>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password"
                            placeholder="Create a password (min 6 chars)" required minlength="6">
                        <span class="input-focus"></span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>
                        Confirm Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm your password" required>
                        <span class="input-focus"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span class="btn-content">
                        <span class="btn-text">Create Account</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12" />
                            <polyline points="12 5 19 12 12 19" />
                        </svg>
                    </span>
                    <span class="btn-loader">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <div class="card-footer">
                <p>Already have an account? <a href="index.html" class="register-link">Sign in here</a></p>
            </div>
        </main>

        <!-- Toast Container -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 GeoQR Attendance System • College Project</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Configuration handled by config.js

        // Toggle form fields based on role
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const studentIdGroup = document.getElementById('studentIdGroup');

        function updateFormFields() {
            const selectedRole = document.querySelector('input[name="role"]:checked').value;

            if (selectedRole === 'student') {
                studentIdGroup.classList.remove('hidden');
                document.getElementById('studentId').required = true;
            } else {
                studentIdGroup.classList.add('hidden');
                document.getElementById('studentId').required = false;
            }
        }

        roleInputs.forEach(input => {
            input.addEventListener('change', updateFormFields);
        });

        // Handle registration form
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const role = document.querySelector('input[name="role"]:checked').value;
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const studentId = document.getElementById('studentId').value.trim();
            const registerBtn = document.getElementById('registerBtn');

            // Validation
            if (password !== confirmPassword) {
                Toast.error('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                Toast.error('Password must be at least 6 characters');
                return;
            }

            if (role === 'student' && !studentId) {
                Toast.error('Student ID is required');
                return;
            }

            // Show loading
            registerBtn.classList.add('loading');
            registerBtn.disabled = true;

            try {
                const response = await axios.post(`${API_BASE_URL}/auth/register`, {
                    name,
                    email,
                    password,
                    role,
                    studentId: role === 'student' ? studentId : null
                });

                const data = response.data;

                if (data.success) {
                    if (data.requiresOtp) {
                        // OTP verification required
                        sessionStorage.setItem('register_temp_token', data.tempToken);
                        sessionStorage.setItem('register_email', email);
                        Toast.success('OTP sent to your email! Redirecting...');
                        setTimeout(() => {
                            window.location.href = 'register-otp.html';
                        }, 1500);
                    } else {
                        // Direct login (fallback)
                        Session.save(data.token, data.user);
                        Toast.success('Account created! Redirecting...');
                        setTimeout(() => {
                            const dashboards = {
                                'student': 'dashboard.html',
                                'faculty': 'faculty-dashboard.html',
                                'admin': 'admin-dashboard.html'
                            };
                            window.location.href = dashboards[role] || 'dashboard.html';
                        }, 1500);
                    }
                }
            } catch (error) {
                const message = error.response?.data?.error || error.message || 'Registration failed';
                Toast.error(message);
                registerBtn.classList.remove('loading');
                registerBtn.disabled = false;
            }
        });
    </script>

    <style>
        /* Additional styles for 3-column role selector */
        .role-selector-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .hidden {
            display: none !important;
        }

        .input-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: var(--space-1);
        }

        /* Smooth transitions for form fields */
        .form-group {
            transition: all var(--transition-normal);
        }

        .form-group.hidden {
            opacity: 0;
            height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <script src="js/theme-engine.js"></script>
</body>

</html>
