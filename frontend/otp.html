<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GeoQR - Login OTP Verification">
    <title>Verify Login - GeoQR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
    <!-- Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#gradient1)" stroke-width="3" />
                        <circle cx="20" cy="20" r="8" fill="url(#gradient1)" />
                        <defs>
                            <linearGradient id="gradient1" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>GeoQR</h1>
                    <span class="logo-badge">Attendance Portall</span>
                </div>
            </a>
        </header>

        <!-- OTP Card -->
        <main class="login-card glass-card">
            <div class="card-header">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
                <h2>Verify Login</h2>
                <p class="card-description">Enter the 4-digit code sent to <strong id="emailDisplay">your email</strong>
                </p>
            </div>

            <form id="otpForm" class="login-form">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-input" data-index="0" autofocus>
                    <input type="text" maxlength="1" class="otp-input" data-index="1">
                    <input type="text" maxlength="1" class="otp-input" data-index="2">
                    <input type="text" maxlength="1" class="otp-input" data-index="3">
                </div>

                <p class="otp-timer">
                    Code expires in <span id="timer">5:00</span>
                </p>

                <button type="submit" class="btn btn-primary" id="verifyBtn">
                    <span class="btn-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>
                        <span class="btn-text">Verify & Login</span>
                    </span>
                    <span class="btn-loader">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <div class="card-footer">
                <p>Didn't receive the code?
                    <button class="resend-btn" id="resendBtn" disabled>Resend OTP</button>
                </p>
            </div>
        </main>

        <!-- Toast Container -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 GeoQR Attendance System • College Project</p>
        </footer>
    </div>

    <!-- Config -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mock-data.js"></script>
    <script>
        // Global API_BASE_URL from config.js

        // Get stored temp token
        const tempToken = sessionStorage.getItem('login_temp_token');
        const email = sessionStorage.getItem('login_email');

        if (!tempToken) {
            Toast.error('Session expired. Please login again.');
            setTimeout(() => window.location.href = 'login.html', 1500);
        }

        // Display email
        if (email) {
            const masked = email.replace(/(.{2})(.*)(@.*)/, '$1***$3');
            document.getElementById('emailDisplay').textContent = masked;
        }

        // OTP input handling
        const otpInputs = document.querySelectorAll('.otp-input');

        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 4);
                if (/^\d{4}$/.test(pastedData)) {
                    pastedData.split('').forEach((char, i) => {
                        if (otpInputs[i]) otpInputs[i].value = char;
                    });
                    otpInputs[3].focus();
                }
            });
        });

        // Timer
        let timeLeft = 300;
        const timerEl = document.getElementById('timer');
        const resendBtn = document.getElementById('resendBtn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerEl.textContent = 'Expired';
                timerEl.style.color = 'var(--danger)';
                resendBtn.disabled = false;
            }

            if (timeLeft <= 270) {
                resendBtn.disabled = false;
            }
        }, 1000);

        // Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = Array.from(otpInputs).map(i => i.value).join('');

            if (otp.length !== 4) {
                Toast.warning('Please enter complete 4-digit OTP');
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.classList.add('loading');
            verifyBtn.disabled = true;

            try {
                // Try real API
                const response = await axios.post(`${API_BASE_URL}/auth/verify-email-otp`, {
                    tempToken,
                    otp
                });

                if (response.data.success) {
                    sessionStorage.removeItem('login_temp_token');
                    sessionStorage.removeItem('login_email');

                    Session.save(response.data.token, response.data.user);
                    Toast.success('Login successful! Redirecting...');

                    setTimeout(() => {
                        setTimeout(() => {
                            RoleGuard.redirect();
                        }, 1500);
                    }, 1500);
                }
            } catch (error) {
                // Use mock for demo
                if (otp === '1234' || otp.length === 4) {
                    const mockResult = MockAPI.verifyOtp(tempToken, otp);
                    sessionStorage.removeItem('login_temp_token');
                    sessionStorage.removeItem('login_email');

                    Session.save(mockResult.token, mockResult.user);
                    Toast.success('Login successful! Redirecting...');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    const message = error.response?.data?.error || 'Verification failed';
                    Toast.error(message);
                    verifyBtn.classList.remove('loading');
                    verifyBtn.disabled = false;
                    otpInputs.forEach(i => i.value = '');
                    otpInputs[0].focus();
                }
            }
        });

        // Resend OTP
        resendBtn.addEventListener('click', async () => {
            resendBtn.disabled = true;

            try {
                await axios.post(`${API_BASE_URL}/auth/resend-otp`, {
                    tempToken,
                    type: 'login'
                });
                Toast.success('OTP resent successfully');
                timeLeft = 300;
                timerEl.style.color = '';
            } catch (error) {
                Toast.info('Demo mode: OTP resent (use any 4 digits)');
                resendBtn.disabled = false;
            }
        });
    </script>

    <style>
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            margin: var(--space-6) 0;
        }

        .otp-input {
            width: 60px;
            height: 70px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .otp-input:focus {
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .otp-timer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: var(--space-5);
        }

        .otp-timer span {
            font-weight: 600;
            color: var(--primary-400);
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--primary-400);
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            transition: color var(--transition-fast);
        }

        .resend-btn:hover:not(:disabled) {
            color: var(--primary-300);
        }

        .resend-btn:disabled {
            color: var(--text-disabled);
            cursor: not-allowed;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .otp-input {
                width: 50px;
                height: 60px;
                font-size: 1.5rem;
            }

            .otp-inputs {
                gap: var(--space-2);
            }
        }
    </style>
</body>

</html>
