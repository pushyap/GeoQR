<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="GeoQR Device - QR Code Generator">
    <title>GeoQR Device</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="device-theme.css">
    <script>
        (function () {
            var theme = localStorage.getItem('geoqr-theme');
            if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'soft-light-pro' : 'dark-pro';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body class="device-fullscreen">
    <div class="device-container">
        <!-- Login Screen -->
        <div class="device-login-screen" id="loginScreen">
            <div class="login-card">
                <div class="login-header">
                    <svg viewBox="0 0 40 40" fill="none" width="60" height="60">
                        <circle cx="20" cy="20" r="18" stroke="url(#devGrad)" stroke-width="3" />
                        <circle cx="20" cy="20" r="8" fill="url(#devGrad)" />
                        <defs>
                            <linearGradient id="devGrad" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <h1>Device Login</h1>
                    <p>Enter device credentials to start QR generation</p>
                </div>
                <form id="deviceLoginForm">
                    <div class="form-group">
                        <label for="deviceCode">Device Code</label>
                        <input type="text" id="deviceCode" placeholder="e.g. DEV-001" required>
                    </div>
                    <div class="form-group">
                        <label for="devicePassword">Password</label>
                        <input type="password" id="devicePassword" placeholder="Enter device password" required>
                    </div>
                    <button type="submit" class="login-btn" id="deviceLoginBtn">
                        <span>Login</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                            <polyline points="10 17 15 12 10 7" />
                            <line x1="15" y1="12" x2="3" y2="12" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Device Screen (hidden until login) -->
        <div class="device-main-screen hidden" id="mainScreen">
            <!-- Header -->
            <header class="device-header">
                <div class="device-logo">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#devGrad2)" stroke-width="3" />
                        <circle cx="20" cy="20" r="8" fill="url(#devGrad2)" />
                        <defs>
                            <linearGradient id="devGrad2" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>GeoQR</span>
                </div>
                <div class="device-header-right">
                    <div class="device-info-badge">
                        <span class="device-id" id="deviceId">DEV-001</span>
                        <span class="device-status online" id="deviceStatus">
                            <span class="status-dot"></span>
                            Online
                        </span>
                    </div>
                    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme"
                        style="width: 36px; height: 36px;">
                        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" width="18" height="18">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" width="18" height="18">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                    </button>
                    <button class="logout-btn" id="logoutBtn" title="Logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Location Info -->
            <div class="location-banner" id="locationBanner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <span id="locationName">Room 101 - CS Lab</span>
            </div>

            <!-- Main QR Section -->
            <main class="qr-main">
                <!-- Idle State -->
                <div class="qr-idle-state" id="idleState">
                    <div class="idle-icon">
                        <svg viewBox="0 0 100 100" fill="none">
                            <rect x="15" y="15" width="25" height="25" rx="4" stroke="#6366f1" stroke-width="3"
                                opacity="0.5" />
                            <rect x="60" y="15" width="25" height="25" rx="4" stroke="#6366f1" stroke-width="3"
                                opacity="0.5" />
                            <rect x="15" y="60" width="25" height="25" rx="4" stroke="#6366f1" stroke-width="3"
                                opacity="0.5" />
                            <rect x="60" y="60" width="25" height="25" rx="4" stroke="#a855f7" stroke-width="3" />
                            <circle cx="50" cy="50" r="12" fill="#6366f1" opacity="0.3" />
                        </svg>
                    </div>
                    <h2>Ready to Generate</h2>
                    <p>Press the button below to start generating QR codes</p>
                    <button class="start-btn" id="startBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3" />
                        </svg>
                        Start QR Generation
                    </button>
                </div>

                <!-- Active QR State -->
                <div class="qr-active-state hidden" id="activeState">
                    <!-- Timer Ring -->
                    <div class="timer-ring-container">
                        <svg class="timer-ring" viewBox="0 0 120 120">
                            <circle class="timer-bg" cx="60" cy="60" r="54" />
                            <circle class="timer-progress" cx="60" cy="60" r="54" id="timerCircle" />
                        </svg>
                        <div class="timer-content">
                            <span class="timer-value" id="timerValue">15</span>
                            <span class="timer-label">sec</span>
                        </div>
                    </div>

                    <!-- QR Code Display -->
                    <div class="qr-display-container">
                        <div class="qr-status-bar">
                            <span class="qr-status active" id="qrStatus">
                                <span class="pulse-dot"></span>
                                QR Active
                            </span>
                        </div>
                        <div class="qr-wrapper">
                            <div id="qrCode"></div>
                        </div>
                        <div class="qr-token">
                            Token: <code id="tokenDisplay">---</code>
                        </div>
                    </div>

                    <!-- Stop Button -->
                    <button class="stop-btn" id="stopBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                        Stop Generation
                    </button>
                </div>
            </main>

            <!-- Footer -->
            <footer class="device-footer">
                <div class="network-status" id="networkStatus">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                        <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                        <circle cx="12" cy="20" r="1" />
                    </svg>
                    <span>Connected</span>
                </div>
                <div class="qr-stats">
                    <span><strong id="qrCount">0</strong> QR codes generated</span>
                </div>
            </footer>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // API_BASE_URL global from config.js

        // Device state
        let deviceData = null;
        let deviceCredentials = null;
        let qrInstance = null;
        let timerInterval = null;
        let refreshInterval = null;
        let timeRemaining = 15;
        let qrCount = 0;
        const QR_REFRESH_SECONDS = 15;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            Toast.init();

            // Check for saved device session
            const savedDevice = sessionStorage.getItem('device_session');
            if (savedDevice) {
                try {
                    const data = JSON.parse(savedDevice);
                    deviceData = data.device;
                    deviceCredentials = data.credentials;
                    showMainScreen();
                } catch (e) {
                    showLoginScreen();
                }
            } else {
                showLoginScreen();
            }

            // Setup event listeners
            document.getElementById('deviceLoginForm').addEventListener('submit', handleDeviceLogin);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('startBtn').addEventListener('click', startGeneration);
            document.getElementById('stopBtn').addEventListener('click', stopGeneration);

            // Check network status
            updateNetworkStatus();
            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
        });

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('hidden');
        }

        function showMainScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');

            // Update UI with device info
            document.getElementById('deviceId').textContent = deviceData.code || deviceData.deviceCode || 'DEV-001';
            document.getElementById('locationName').textContent = deviceData.location || deviceData.locationName || 'Unknown Location';
        }

        async function handleDeviceLogin(e) {
            e.preventDefault();

            const deviceCode = document.getElementById('deviceCode').value.trim();
            const password = document.getElementById('devicePassword').value;
            const loginBtn = document.getElementById('deviceLoginBtn');

            if (!deviceCode || !password) {
                Toast.warning('Please enter device code and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>Logging in...</span>';

            try {
                const response = await axios.post(`${API_BASE_URL}/devices/login`, {
                    device_code: deviceCode,
                    password: password
                });

                if (response.data.success) {
                    deviceData = response.data.device;
                    deviceCredentials = { device_code: deviceCode, password: password };

                    // Save to session
                    sessionStorage.setItem('device_session', JSON.stringify({
                        device: deviceData,
                        credentials: deviceCredentials
                    }));

                    Toast.success('Device logged in successfully!');
                    showMainScreen();
                }
            } catch (error) {
                const message = error.response?.data?.error || 'Device login failed';
                Toast.error(message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Login</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>';
            }
        }

        function handleLogout() {
            // Stop any QR generation
            if (timerInterval) clearInterval(timerInterval);
            if (refreshInterval) clearInterval(refreshInterval);

            // Clear device session
            sessionStorage.removeItem('device_session');
            deviceData = null;
            deviceCredentials = null;
            qrCount = 0;

            // Reset QR display
            document.getElementById('qrCode').innerHTML = '';
            document.getElementById('activeState').classList.add('hidden');
            document.getElementById('idleState').classList.remove('hidden');
            document.getElementById('qrCount').textContent = '0';

            Toast.info('Device logged out');
            showLoginScreen();
        }

        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            if (navigator.onLine) {
                statusEl.classList.remove('offline');
                statusEl.querySelector('span').textContent = 'Connected';
            } else {
                statusEl.classList.add('offline');
                statusEl.querySelector('span').textContent = 'Offline';
            }
        }

        function startGeneration() {
            document.getElementById('idleState').classList.add('hidden');
            document.getElementById('activeState').classList.remove('hidden');
            document.getElementById('deviceStatus').innerHTML = '<span class="status-dot active"></span>Generating';
            document.getElementById('deviceStatus').className = 'device-status generating';

            generateQR();
            startTimer();

            Toast.success('QR generation started');
        }

        function stopGeneration() {
            if (timerInterval) clearInterval(timerInterval);
            if (refreshInterval) clearInterval(refreshInterval);

            document.getElementById('activeState').classList.add('hidden');
            document.getElementById('idleState').classList.remove('hidden');
            document.getElementById('deviceStatus').innerHTML = '<span class="status-dot"></span>Online';
            document.getElementById('deviceStatus').className = 'device-status online';

            // Clear QR
            document.getElementById('qrCode').innerHTML = '';

            Toast.info('QR generation stopped');
        }

        function generateQR() {
            const timestamp = Date.now();
            const randomPart = Math.random().toString(36).substring(2, 10);
            const token = `GQR-${timestamp}-${randomPart}`;

            const qrData = JSON.stringify({
                token,
                deviceId: deviceData.deviceCode,
                locationId: deviceData.locationId,
                latitude: deviceData.latitude,
                longitude: deviceData.longitude,
                radius: deviceData.radius,
                expiresAt: timestamp + (QR_REFRESH_SECONDS * 1000)
            });

            // Clear old QR
            const qrContainer = document.getElementById('qrCode');
            qrContainer.innerHTML = '';

            // Generate new QR
            qrInstance = new QRCode(qrContainer, {
                text: qrData,
                width: 220,
                height: 220,
                colorDark: "#1e293b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Update token display
            document.getElementById('tokenDisplay').textContent = token.substring(0, 18) + '...';

            // Update count
            qrCount++;
            document.getElementById('qrCount').textContent = qrCount;

            // Update status
            document.getElementById('qrStatus').innerHTML = '<span class="pulse-dot"></span>QR Active';
            document.getElementById('qrStatus').className = 'qr-status active';

            // Reset timer
            timeRemaining = QR_REFRESH_SECONDS;
            updateTimerDisplay();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            if (refreshInterval) clearInterval(refreshInterval);

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    document.getElementById('qrStatus').innerHTML = '<span class="pulse-dot warning"></span>Refreshing...';
                    document.getElementById('qrStatus').className = 'qr-status refreshing';
                }
            }, 1000);

            refreshInterval = setInterval(() => {
                generateQR();
            }, QR_REFRESH_SECONDS * 1000);
        }

        function updateTimerDisplay() {
            const timerValue = document.getElementById('timerValue');
            const timerCircle = document.getElementById('timerCircle');

            timerValue.textContent = timeRemaining;

            // Update progress ring
            const circumference = 2 * Math.PI * 54;
            const progress = (timeRemaining / QR_REFRESH_SECONDS) * circumference;
            timerCircle.style.strokeDasharray = `${progress} ${circumference}`;

            // Color changes
            if (timeRemaining <= 3) {
                timerValue.style.color = '#ef4444';
                timerCircle.style.stroke = '#ef4444';
            } else if (timeRemaining <= 5) {
                timerValue.style.color = '#f59e0b';
                timerCircle.style.stroke = '#f59e0b';
            } else {
                timerValue.style.color = '#a855f7';
                timerCircle.style.stroke = 'url(#timerGradient)';
            }
        }
    </script>


    <!-- SVG Gradient -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
        </defs>
    </svg>
    <script src="../js/theme-engine.js"></script>
</body>

</html>
