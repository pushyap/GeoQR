<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GeoQR Portal - Attendance Management System Login">
    <title>GeoQR Portal - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <!-- Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="#6366f1" stroke-width="3" />
                        <circle cx="20" cy="20" r="8" fill="#6366f1" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>GeoQR</h1>
                    <span class="logo-badge">Attendance Portal</span>
                </div>
            </a>
        </header>

        <!-- Login Card -->
        <main class="login-card glass-card">

            <div class="card-header">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </div>
                <h2>Welcome Back</h2>
                <p class="card-description">Sign in to access the attendance system</p>
            </div>

            <form id="loginForm" class="login-form">

                <!-- Role Selection -->
                <div class="form-group">
                    <label>Select Role</label>
                    <div class="role-selector role-selector-3">
                        <input type="radio" id="roleStudent" name="role" value="student" checked>
                        <label for="roleStudent" class="role-option">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c3 3 9 3 12 0v-5" />
                            </svg>
                            <span>Student</span>
                        </label>

                        <input type="radio" id="roleFaculty" name="role" value="faculty">
                        <label for="roleFaculty" class="role-option">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <span>Faculty</span>
                        </label>

                        <input type="radio" id="roleAdmin" name="role" value="admin">
                        <label for="roleAdmin" class="role-option">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                            </svg>
                            <span>Admin</span>
                        </label>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="userId">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        Email
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="userId" placeholder="Enter your email" required>
                        <span class="input-focus"></span>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <span class="input-focus"></span>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="btn-content">
                        <span class="btn-text">Sign In</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12" />
                            <polyline points="12 5 19 12 12 19" />
                        </svg>
                    </span>
                    <span class="btn-loader">
                        <span class="spinner"></span>
                    </span>
                </button>

            </form>

            <div class="card-footer">
                <p>Don't have an account?
                    <a href="register.html" class="register-link">Register here</a>
                </p>
            </div>

        </main>

        <!-- Toast -->
        <div id="toastContainer" class="toast-container"></div>

        <footer class="footer">
            <p>© 2024 GeoQR Attendance System • College Project</p>
        </footer>
    </div>

    <!-- Config Script -->
    <script src="js/config.js"></script>
    <!-- Main Auth Script -->
    <script src="js/auth.js"></script>

    <script>
        // Enhanced login with Axios
        // API_BASE_URL is now global from config.js

        // Override the default login handler if needed
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');

            if (!email || password.length < 4) {
                Toast.warning('Enter valid email and password');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                // Use Axios for API call
                const response = await axios.post(`${API_BASE_URL}/auth/login`, {
                    email,
                    password
                });

                const data = response.data;

                // Student requires OTP
                if (data.requiresOtp) {
                    sessionStorage.setItem('login_temp_token', data.tempToken);
                    sessionStorage.setItem('login_email', email);

                    Toast.success('OTP sent to your email');
                    window.location.href = 'otp.html';
                    return;
                }

                // Direct login (Faculty/Admin)
                if (data.success) {
                    // Store session
                    if (rememberMe) {
                        localStorage.setItem('geoqr_remember', 'true');
                    }

                    Session.save(data.token, data.user);
                    Toast.success('Login successful');

                    setTimeout(() => {
                        const dashboards = {
                            'student': 'dashboard.html',
                            'faculty': 'faculty-dashboard.html',
                            'admin': 'admin-dashboard.html'
                        };
                        window.location.href = dashboards[data.user.role] || 'dashboard.html';
                    }, 800);
                }

            } catch (error) {
                const message = error.response?.data?.error || error.message || 'Login failed';
                Toast.error(message);
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Check for remembered session
        document.addEventListener('DOMContentLoaded', () => {
            if (Session.isValid()) {
                const user = Session.getUser();
                if (user) {
                    const dashboards = {
                        'student': 'dashboard.html',
                        'faculty': 'faculty-dashboard.html',
                        'admin': 'admin-dashboard.html'
                    };
                    window.location.href = dashboards[user.role] || 'dashboard.html';
                }
            }
        });
    </script>

    <style>
        /* Role selector 3 columns */
        .role-selector-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        /* Form options row */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: calc(var(--space-2) * -1);
        }

        /* Custom checkbox */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            display: none;
        }

        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .checkbox-label input:checked+.checkmark {
            background: var(--gradient-primary);
            border-color: var(--primary-500);
        }

        .checkbox-label input:checked+.checkmark::after {
            content: '';
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .checkbox-label:hover .checkmark {
            border-color: var(--primary-500);
        }

        /* Forgot password link */
        .forgot-link {
            font-size: 0.85rem;
            color: var(--primary-400);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .forgot-link:hover {
            color: var(--primary-300);
        }

        /* Card icon */
        .card-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto var(--space-4);
            background: var(--gradient-primary);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-glow);
        }

        .card-icon svg {
            width: 30px;
            height: 30px;
            color: white;
        }

        /* Button enhancements */
        .btn-content {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .btn-arrow {
            width: 20px;
            height: 20px;
            transition: transform var(--transition-normal);
        }

        .btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* Logo link styling */
        .logo {
            text-decoration: none;
            color: inherit;
        }

        .logo:hover {
            opacity: 0.9;
        }
    </style>

</body>

</html>
