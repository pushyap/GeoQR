<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GeoQR - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container">
    <main class="login-card glass-card">
        <h2>Create Account</h2>

        <form id="registerForm">

            <!-- Full Name -->
            <input type="text" id="name" placeholder="Full Name" required>

            <!-- Email -->
            <input type="email" id="email" placeholder="Email" required>

            <!-- Mobile Number -->
            <input
                type="tel"
                id="mobile"
                placeholder="10-digit Mobile Number"
                pattern="[0-9]{10}"
                required
            >

            <!-- Password -->
            <input type="password" id="password" placeholder="Password" required>

            <!-- Confirm Password -->
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <p>Already registered? <a href="index.html">Login</a></p>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/auth.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const mobile_number = document.getElementById('mobile').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }

    if (mobile_number.length !== 10) {
        alert('Enter valid 10-digit mobile number');
        return;
    }

    try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name,
                email,
                password,
                mobile_number
            })
        });

        const data = await res.json();

        if (!data.success) {
            alert(data.error || 'Registration failed');
            return;
        }

        alert('Registration successful. Please login to verify OTP.');
        window.location.href = 'index.html';

    } catch (err) {
        alert('Server error');
    }
});
</script>
</body>
</html>
